[program:room]
command=/usr/bin/node /opt/room/server.mjs
priority=600
user=%(ENV_USER)s
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s",NODE_ENV="production",PORT="8081",ROOM_DATA_DIR="/data/room",MEDIABRIDGE_URL="http://127.0.0.1:8765",NEKO_PROXY_URL="http://127.0.0.1:8080",GO2RTC_URL="http://127.0.0.1:1984",STREAMING_BACKEND="%(ENV_STREAMING_BACKEND)s",DESKTOP_SCREEN="%(ENV_DESKTOP_SCREEN)s",ROOM_JOIN_CODE="%(ENV_ROOM_JOIN_CODE)s",ROOM_ADMIN_USERNAME="%(ENV_ROOM_ADMIN_USERNAME)s",ROOM_ADMIN_PASSWORD="%(ENV_ROOM_ADMIN_PASSWORD)s",ROOM_NAME="%(ENV_ROOM_NAME)s",TRUST_PROXY="%(ENV_TRUST_PROXY)s",ROOM_INITIAL_WEBRTC_ADDRESS="%(ENV_ROOM_INITIAL_WEBRTC_ADDRESS)s",ROOM_INITIAL_WEBRTC_RANGE="%(ENV_ROOM_INITIAL_WEBRTC_RANGE)s"
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
