[program:startup-checks]
command=/usr/local/bin/check-neko-stream
priority=560
user=%(ENV_USER)s
environment=DISPLAY="%(ENV_DISPLAY)s",PULSE_SERVER="unix:/tmp/pulseaudio.socket",STREAMING_BACKEND="%(ENV_STREAMING_BACKEND)s"
autostart=true
autorestart=false
startsecs=0
exitcodes=0,1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
