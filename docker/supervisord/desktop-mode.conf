[program:desktop-mode]
command=/bin/bash /usr/local/bin/set-desktop-mode
priority=325
user=%(ENV_USER)s
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s",VIRTUAL_DESKTOP_SCREEN="%(ENV_VIRTUAL_DESKTOP_SCREEN)s"
autorestart=false
startsecs=0
startretries=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
