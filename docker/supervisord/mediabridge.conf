[program:mediabridge]
command=/usr/local/bin/start-mediabridge-as-neko
priority=500
user=root
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s",XDG_CONFIG_HOME="/data/mediabridge/config",XDG_DATA_HOME="/data/mediabridge/data",MEDIABRIDGE_LIBREWOLF_PROFILE="/data/mediabridge/profile",MEDIABRIDGE_LIBREWOLF_LAUNCHER="/usr/local/bin/mediabridge-librewolf",MEDIABRIDGE_MOONLIGHT="/opt/moonlight-current/squashfs-root/AppRun",PULSE_SERVER="unix:/tmp/pulseaudio.socket",GPU_DEVICE_GIDS="%(ENV_GPU_DEVICE_GIDS)s"
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
