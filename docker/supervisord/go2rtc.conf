[program:go2rtc]
command=/usr/local/bin/start-go2rtc-as-neko
priority=550
user=root
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s",PULSE_SERVER="unix:/tmp/pulseaudio.socket",ROOM_DATA_DIR="/data/room",DESKTOP_SCREEN="%(ENV_DESKTOP_SCREEN)s",STREAM_ENCODER="%(ENV_STREAM_ENCODER)s",GPU_DEVICE_GIDS="%(ENV_GPU_DEVICE_GIDS)s"
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
